  <title>Sesiones - CORE Metropolitano</title>
  <link rel="stylesheet" href="/css/style.css">

<body>
  <header class="site-header">
    <h1>Consejo Regional Metropolitano de Santiago</h1>
    <p>Visor ciudadano de actas, acuerdos y actividad del CORE Metropolitano</p>
    <nav>
      <a href="/">Inicio</a>

  <div class="container">
    <form class="filters" id="filtros">
      <div class="field">
        <label>Buscar</label>
        <input type="text" id="q" placeholder="Palabra clave...">
      </div>
      <div class="field">
        <label>Categor&iacute;a</label>
        <select id="categoria"><option value="">Todas</option></select>
      </div>

        <label>Desde</label>

      </div>
      <div class="field">
        <label>Hasta</label>
        <input type="date" id="fecha_hasta">
      </div>
      <button type="submit" class="btn">Buscar</button>
      <button type="button" class="btn btn-outline" id="limpiar">Limpiar</button>
    </form>

    <div id="contenido" class="loading">Cargando sesiones...</div>
